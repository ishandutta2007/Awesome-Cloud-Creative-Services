<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="auto">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c16" />
      <stop offset="50%" stop-color="#0e1329" />
      <stop offset="100%" stop-color="#070913" />
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="sub-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="accent-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Glowing filters -->
    <filter id="glow-cyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="35" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-purple" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="40" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>

    <style>
      .glow-orb-1 {
        animation: pulse1 8s ease-in-out infinite alternate;
      }
      .glow-orb-2 {
        animation: pulse2 10s ease-in-out infinite alternate;
      }
      .stream-wave {
        animation: wave-move 12s linear infinite;
      }
      .badge-float-1 {
        animation: float1 5s ease-in-out infinite alternate;
      }
      .badge-float-2 {
        animation: float2 6s ease-in-out infinite alternate;
      }
      .badge-float-3 {
        animation: float1 7s ease-in-out infinite alternate;
      }

      @keyframes pulse1 {
        0% { transform: translate(0px, 0px) scale(1); opacity: 0.35; }
        50% { transform: translate(40px, -20px) scale(1.15); opacity: 0.6; }
        100% { transform: translate(-30px, 30px) scale(0.95); opacity: 0.4; }
      }

      @keyframes pulse2 {
        0% { transform: translate(0px, 0px) scale(1); opacity: 0.3; }
        50% { transform: translate(-50px, 25px) scale(1.2); opacity: 0.55; }
        100% { transform: translate(30px, -35px) scale(0.9); opacity: 0.35; }
      }

      @keyframes wave-move {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 600; }
      }

      @keyframes float1 {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-8px); }
      }

      @keyframes float2 {
        0% { transform: translateY(0px); }
        100% { transform: translateY(8px); }
      }
    </style>
  </defs>

  <!-- Deep Background -->
  <rect width="1200" height="400" rx="16" fill="url(#bg-grad)" />

  <!-- Grid Overlay -->
  <rect width="1200" height="400" rx="16" fill="url(#grid-pattern)" />

  <!-- Dynamic Glowing Orbs in Background -->
  <circle class="glow-orb-1" cx="220" cy="120" r="130" fill="#3b82f6" filter="url(#glow-cyan)" />
  <circle class="glow-orb-2" cx="980" cy="280" r="150" fill="#8b5cf6" filter="url(#glow-purple)" />
  <circle class="glow-orb-1" cx="600" cy="340" r="100" fill="#06b6d4" opacity="0.2" filter="url(#glow-cyan)" />

  <!-- Dynamic Flowing Accent Lines (Background) -->
  <path class="stream-wave" d="M -100 320 Q 300 240, 600 310 T 1300 260" fill="none" stroke="url(#accent-cyan)" stroke-width="2.5" stroke-dasharray="16, 12" opacity="0.4" />
  <path class="stream-wave" d="M -100 350 Q 350 390, 750 330 T 1300 370" fill="none" stroke="url(#accent-purple)" stroke-width="2" stroke-dasharray="20, 15" opacity="0.35" />

  <!-- Foreground Title and Content -->
  <g id="foreground-content">
    <!-- Top Pill Category -->
    <g class="badge-float-1" transform="translate(430, 48)">
      <rect width="340" height="34" rx="17" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.18)" stroke-width="1.2" />
      <circle cx="22" cy="17" r="5" fill="#38bdf8" />
      <text x="36" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="1">CURATED CREATIVE INFRASTRUCTURE</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="148" text-anchor="middle" fill="url(#text-grad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="800" letter-spacing="-1">Awesome Cloud Creative Services</text>

    <!-- Subtitle -->
    <text x="600" y="196" text-anchor="middle" fill="url(#sub-grad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" letter-spacing="0.2">Media Processing APIs • Dynamic Image CDNs • Self-Hosted Creative Pipelines</text>

    <!-- Feature Pills Row -->
    <g transform="translate(185, 240)">
      <!-- Pill 1 -->
      <g class="badge-float-1" transform="translate(0, 0)">
        <rect width="180" height="42" rx="21" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5" />
        <text x="90" y="26" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">⚡ Real-time Image APIs</text>
      </g>
      <!-- Pill 2 -->
      <g class="badge-float-2" transform="translate(210, 0)">
        <rect width="195" height="42" rx="21" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(129, 140, 248, 0.4)" stroke-width="1.5" />
        <text x="97" y="26" text-anchor="middle" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">🎬 Video Transcoding</text>
      </g>
      <!-- Pill 3 -->
      <g class="badge-float-1" transform="translate(435, 0)">
        <rect width="185" height="42" rx="21" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(192, 132, 252, 0.4)" stroke-width="1.5" />
        <text x="92" y="26" text-anchor="middle" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">🛠️ Self-Hosted Engines</text>
      </g>
      <!-- Pill 4 -->
      <g class="badge-float-3" transform="translate(650, 0)">
        <rect width="180" height="42" rx="21" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(244, 114, 182, 0.4)" stroke-width="1.5" />
        <text x="90" y="26" text-anchor="middle" fill="#f472b6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">🤖 Generative Automation</text>
      </g>
    </g>

    <!-- Bottom Highlights -->
    <text x="600" y="340" text-anchor="middle" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" letter-spacing="0.5">Cloudinary • FFmpeg • libvips • imgproxy • Sharp • Remotion • Pillow • ImageMagick</text>
  </g>
</svg>
